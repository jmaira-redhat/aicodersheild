schemaVersion: 2.2.0
metadata:
  name: aicodershield-workspace
  display-name: "AI Project Shield - Secure Workspace"
  description: "Governance-backed AI development environment with automated key injection."

projects:
  - name: aicodershield
    git:
      remotes:
        origin: "https://github.com/jmaira-redhat/aicodersheild.git"
      # Adding checkoutStrategy ensures the cloner doesn't get stuck
      

components:
  - name: dev-runtime
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:latest
      memoryLimit: 8Gi
      mountSources: true
      # Note: No env/valueFrom needed! The controller injects ai-creds automatically.

commands:
  - id: 01-shield-init
    exec:
      component: dev-runtime
      commandLine: |
        echo "🛡️  Configuring Project Shield Environment..."
        
        # 1. Path & Permissions Setup
        mkdir -p ${HOME}/.local/bin
        npm config set prefix ${HOME}/.local
        export PATH="${HOME}/.local/bin:$PATH"

        # 2. Tool Installation
        if ! command -v claude >/dev/null; then
          echo "📦 Installing Claude Code CLI..."
          npm install -g @anthropic-ai/claude-code
        fi

        # 3. Final Verification
        echo "✅ AI Shield Active."
        
        # 4. Trigger IDE Notification (The Pop-up)
        if command -v code >/dev/null; then
          code --status > /dev/null 2>&1 && \
          code -n --wait --status > /dev/null 2>&1 || \
          echo "Notifying IDE..."
          # This triggers the VS Code toast notification
          /usr/bin/code --messaging "🛡️ Project Shield Active: AI Keys Injected & Tools Ready!"
        fi

        # Output keys to terminal for manual check
        env | grep -E 'OPENAI|ANTHROPIC' | awk -F= '{print "   " $1 "=****************"}'
      workingDir: ${PROJECTS_ROOT}/aicodersheild
      group:
        kind: run
        isDefault: true
  - id: 02-install-ai-tools
    exec:
      component: dev-runtime
      commandLine: |
        echo "Installing Department-approved AI CLI tools..."
        npm install -g @openai/codex
        # Example for 2026 AI toolchains
        curl -fsSL https://claude.ai/install.sh | bash
      workingDir: ${PROJECTS_ROOT}/aicodershield