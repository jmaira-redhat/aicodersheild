schemaVersion: 2.2.0
metadata:
  name: aicodersheild-workspace
  description: "Enterprise Governed AI Workspace: NestJS, React, Cloud Code, Codex & Claude"
projects:
  - name: aicodersheild
    git:
      remotes:
        origin: "https://github.com/jmaira-redhat/aicodersheild.git"
components:
  - name: dev-runtime
    container:
      image: quay.io/devspaces/universal-developer-image:latest
      memoryLimit: 8Gi # Essential for running local AI agents + Nest + React
      cpuLimit: "4"
      mountSources: true
      env:
        # These are injected from OpenShift Secrets (Governed at the Project level)
        - name: OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-shield-creds
              key: OPENAI_API_KEY
        - name: ANTHROPIC_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-shield-creds
              key: ANTHROPIC_API_KEY
      endpoints:
        - name: react-frontend
          targetPort: 3000
        - name: nest-backend
          targetPort: 3001
commands:
  - id: install-tools
    exec:
      component: dev-runtime
      commandLine: |
        # 1. Install Project Dependencies
        npm install
        
        # 2. Install OpenAI Codex CLI (v0.111.0 - GPT-5.4 Spark optimized)
        npm install -g @openai/codex
        
        # 3. Install Claude Code (Native 2026 Installer)
        curl -fsSL https://claude.ai/install.sh | bash
        
        # 4. Install Cloud Code / Google Cloud SDK
        curl https://sdk.cloud.google.com | bash
        source $HOME/google-cloud-sdk/path.bash.inc
      workingDir: ${PROJECTS_ROOT}/aicodersheild
      group:
        kind: build
        isDefault: true

  - id: start-dev-stack
    exec:
      component: dev-runtime
      commandLine: "npm run start:dev" 
      workingDir: ${PROJECTS_ROOT}/aicodersheild
      group:
        kind: run
        isDefault: true