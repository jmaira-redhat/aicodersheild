schemaVersion: 2.2.0
metadata:
  name: aicodershield-workspace
  display-name: "AI Project Shield - Secure Workspace"
  description: "Governance-backed AI development environment with automated key injection."

projects:
  - name: aicodershield
    git:
      remotes:
        origin: "https://github.com/jmaira-redhat/aicodersheild.git"
      # Adding checkoutStrategy ensures the cloner doesn't get stuck
      

components:
  - name: dev-runtime
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:latest
      memoryLimit: 8Gi
      mountSources: true
      # Note: No env/valueFrom needed! The controller injects ai-creds automatically.

commands:
  - id: 01-shield-init
    exec:
      component: dev-runtime
      commandLine: |
        echo "🛡️  Configuring Project Shield Environment..."
        
        # 1. Fix Permissions: Redirect NPM to home directory
        mkdir -p ${HOME}/.local/bin
        npm config set prefix ${HOME}/.local
        export PATH="${HOME}/.local/bin:$PATH"

        # 2. Install OpenAI Codex CLI
        if ! command -v openai >/dev/null; then
          echo "📦 Installing OpenAI Codex..."
          npm install -g @openai/codex
        fi
        
        # 3. Install Anthropic Claude CLI
        if ! command -v claude >/dev/null; then
          echo "📦 Installing Anthropic Claude CLI..."
          npm install -g @anthropic-ai/claude-code
        fi

        echo "✅ AI Shield Active. Verifying Status..."
        
        # Verify Binary Path
        echo "📍 Claude Path: $(which claude)"
        claude --version
        
        # Verify Credentials
        echo "🔑 Injected Keys:"
        env | grep -E 'OPENAI|ANTHROPIC' | awk -F= '{print "   " $1 "=****************"}'
        
        echo "🚀 All systems go. You are now shielded."
      workingDir: ${PROJECTS_ROOT}/aicodersheild
      group:
        kind: run
        isDefault: true
  - id: 02-install-ai-tools
    exec:
      component: dev-runtime
      commandLine: |
        echo "Installing Department-approved AI CLI tools..."
        npm install -g @openai/codex
        # Example for 2026 AI toolchains
        curl -fsSL https://claude.ai/install.sh | bash
      workingDir: ${PROJECTS_ROOT}/aicodershield