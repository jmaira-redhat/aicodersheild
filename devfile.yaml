schemaVersion: 2.2.0
metadata:
  name: aicodershield-workspace
  display-name: "AI Project Shield - Secure Workspace"
  description: "Governance-backed AI development environment with automated key injection."

# 1. Automate the Shield on Startup
events:
  postStart:
    - 01-shield-init

projects:
  - name: aicodershield
    git:
      remotes:
        origin: "https://github.com/jmaira-redhat/aicodersheild.git"
    clonePath: aicodershield

components:
  - name: dev-runtime
    container:
      image: registry.redhat.io/devspaces/udi-rhel9:latest
      memoryLimit: 8Gi
      mountSources: true

commands:
  - id: 01-shield-init
    exec:
      component: dev-runtime
      commandLine: |
        echo "🛡️  Configuring Project Shield Environment..."

        # ── 1. Path & Permissions Setup ───────────────────────────────────────
        mkdir -p ${HOME}/.local/bin
        npm config set prefix ${HOME}/.local
        export PATH="${HOME}/.local/bin:$PATH"

        if ! grep -q ".local/bin" ${HOME}/.bashrc; then
          echo 'export PATH="${HOME}/.local/bin:$PATH"' >> ${HOME}/.bashrc
        fi

        # ── 2. Tool Installation ──────────────────────────────────────────────
        if ! command -v claude >/dev/null; then
          echo "📦 Installing Anthropic Claude Code..."
          npm install -g @anthropic-ai/claude-code
        fi

        if ! command -v openai >/dev/null; then
          echo "📦 Installing OpenAI Codex..."
          npm install -g @openai/codex
        fi

        # ── 3. Claude Code Zero-Touch Configuration ───────────────────────────
        echo "🔧 Configuring Claude Code..."

        if [ -z "${ANTHROPIC_API_KEY:-}" ]; then
          echo "⚠️  WARNING: ANTHROPIC_API_KEY is not set. Claude Code will not work."
          echo "   Ensure the key is injected as an OpenShift secret/env variable."
        else
          mkdir -p ${HOME}/.claude

          # settings.json — quoted heredoc ('SETTINGS_EOF') prevents shell expansion
          # inside the block, so $ANTHROPIC_API_KEY stays as a literal and is
          # evaluated at runtime each time the developer runs claude.
          cat > ${HOME}/.claude/settings.json << 'SETTINGS_EOF'
{
  "apiKeyHelper": "echo $ANTHROPIC_API_KEY"
}
SETTINGS_EOF

          # ~/.claude.json — unquoted heredoc (CLAUDE_EOF) so the key fingerprint
          # variable is expanded NOW at onboarding time, not at runtime.
          ANTHROPIC_API_KEY_LAST_20="${ANTHROPIC_API_KEY: -20}"
          cat > ${HOME}/.claude.json << CLAUDE_EOF
{
  "hasCompletedOnboarding": true,
  "customApiKeyResponses": {
    "approved": ["${ANTHROPIC_API_KEY_LAST_20}"],
    "rejected": []
  }
}
CLAUDE_EOF

          echo "✅ Claude Code configured (zero-touch, no credentials on disk)."
        fi

        # ── 4. Final Verification & Shield Status ─────────────────────────────
        echo "✅ AI Shield Active."
        echo "📍 Claude version: $(claude --version 2>/dev/null || echo 'Claude ready')"

        # ── 5. IDE Notification ───────────────────────────────────────────────
        if [ -f "/usr/bin/code" ]; then
          /usr/bin/code --messaging "🛡️ Project Shield Active: AI Keys Injected & Tools Ready!"
        fi

        # ── 6. Governance Check — masked key output for verification ──────────
        echo "🔑 Governance Check (Injected Keys):"
        env | grep -E 'OPENAI|ANTHROPIC' | awk -F= '{print "   " $1 "=****************"}'

        echo "🚀 Workspace Ready. Happy Coding!"
      workingDir: ${PROJECTS_ROOT}/aicodersheild
      group:
        kind: run
        isDefault: true
